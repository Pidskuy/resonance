[project]
name = "resonance"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.48.1",
    "numpy>=2.5.4",
    "pywebview>=6.2.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Lets tests import from scripts/ and app/ (the project folder goes on Python's search path)
pythonpath = ["."]
testpaths = ["tests"]
